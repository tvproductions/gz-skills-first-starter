[project]
name = "skills-first-starter"
version = "0.5.0"
description = "Project-scoped SP + SP-BP + gz-skills adoption scaffold"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.scripts]
skills-first-starter = "skills_first_starter.cli:main"

[build-system]
requires = ["uv_build==0.13.1"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.13.1"
python-preference = "only-managed"

[tool.uv.build-backend]
source-include = [
    "bundle.json", "templates/**", ".agents/plugins/marketplace.json",
    ".claude-plugin/marketplace.json", "starter.py", "tests/**", "tools/**",
    "docs/**", "AGENTS.md", "ROADMAP.md", "CHANGELOG.md", ".python-version",
    "uv.lock", ".pre-commit-config.yaml", ".github/workflows/**",
    ".gitattributes", ".gitignore",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

# Routine tools and explicit on-demand analysis stay out of runtime dependencies.
[dependency-groups]
dev = ["ruff==0.15.22", "ty==0.0.89", "pre-commit==4.7.0"]
hygiene = [
    "complexipy==8.0.1",
    "cosmic-ray==8.7.0",
    "lizard==1.24.1",
]

# C901 is deliberately absent from the routine lint selection above.
[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.complexipy]
paths = ["src", "tests", "tools/engineering"]
max-complexity-allowed = 15
check-script = true
no-ignore = true
snapshot-ignore = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "starter.py", "tests", "tools"]
