repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
      - id: ty
        name: ty
        entry: uv run --locked ty check
        language: system
        types: [python]
      - id: unittest
        name: unittest
        entry: uv run --locked python -m unittest discover -s tests -v
        language: system
        pass_filenames: false
        files: '^(src/|tests/|templates/|tools/|starter\.py$|bundle\.json$|pyproject\.toml$|uv\.lock$|\.python-version$|\.agents/plugins/|\.claude-plugin/|docs/engineering/architectural-decisions\.md$|\.pre-commit-config\.yaml$|\.github/workflows/)'
