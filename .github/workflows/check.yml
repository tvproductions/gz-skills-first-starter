name: Check starter
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.8'
      - run: uv run --python 3.14.8 -m unittest discover -s tests -v
      - run: uv run --python 3.14.8 starter.py validate
      - run: uvx --python 3.14.8 ruff==0.15.18 check .
      - run: uvx --python 3.14.8 ruff==0.15.18 format --check .
